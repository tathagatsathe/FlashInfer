[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashinfer"
version = "0.3.0"
description = "Minimal LLM inference engine built from scratch in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
server = ["fastapi>=0.100", "uvicorn>=0.23"]

[project.scripts]
flashinfer-serve = "flashinfer.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flashinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
