[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashinfer"
version = "0.1.0"
description = "Minimal GPT-2 inference engine built from scratch in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flashinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
